<!DOCTYPE html>
<html lang="ru" dir="ltr" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CaptchaQ - VLESS Checker</title>
<meta name="theme-color" content="#030706">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Space+Grotesk:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
:root{color-scheme:dark;--bs-body-font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--xp-heading-font:'Space Grotesk','Inter',-apple-system,sans-serif;--xp-emerald:#10b981;--xp-teal:#14b8a6;--xp-cyan:#06b6d4}
[data-bs-theme="dark"]{--bs-body-bg:#030706;--my-heading-color:#e8f5f1;--my-content-color:rgba(255,255,255,0.55);--my-card-bg:rgba(255,255,255,0.07);--my-card-border:rgba(255,255,255,0.13);--my-card-hover-border:rgba(16,185,129,0.4);--my-card-hover-bg:rgba(16,185,129,0.1)}
[data-bs-theme="light"]{--bs-body-bg:#e8f0ec;--my-heading-color:#064e3b;--my-content-color:rgba(6,78,59,0.7);--my-card-bg:rgba(255,255,255,0.75);--my-card-border:rgba(6,78,59,0.10);--my-card-hover-border:rgba(16,185,129,0.35);--my-card-hover-bg:rgba(16,185,129,0.08)}
body{background:var(--bs-body-bg);color:var(--my-heading-color);font-family:var(--bs-body-font-family);min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4,h5{font-family:var(--xp-heading-font);letter-spacing:-0.01em}
.gradient-text{background:linear-gradient(135deg,#34d399,#10b981,#14b8a6,#06b6d4);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradientShift 6s ease infinite}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.my-container{max-width:960px}
.card-glass{border-radius:1rem;background:var(--my-card-bg);border:1px solid var(--my-card-border);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);padding:1.25rem;transition:all 0.35s cubic-bezier(0.4,0,0.2,1)}
.card-glass:hover{border-color:var(--my-card-hover-border);background:var(--my-card-hover-bg);transform:translateY(-4px);box-shadow:0 12px 40px rgba(16,185,129,0.15)}
.stat-value{font-family:var(--xp-heading-font);font-size:2rem;font-weight:700;line-height:1.1}
.stat-label{color:var(--my-content-color);font-size:0.85rem;margin-top:0.25rem}
.cc-row{display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.cc-row:last-child{border-bottom:none}
.cc-flag{font-size:1.4rem;flex-shrink:0}
.cc-name{flex:1;font-weight:600;font-size:0.95rem}
.cc-count{color:var(--my-content-color);font-size:0.85rem;min-width:40px;text-align:right}
.cc-ping{font-family:var(--xp-heading-font);font-weight:600;font-size:0.9rem;min-width:55px;text-align:right}
.cc-bar-wrap{width:120px;height:6px;border-radius:3px;background:rgba(255,255,255,0.06);overflow:hidden;flex-shrink:0}
.cc-bar{height:100%;border-radius:3px;transition:width 0.6s ease}
.ping-fast{color:#34d399}.ping-mid{color:#fbbf24}.ping-slow{color:#f87171}
.badge-fast{background:rgba(52,211,153,0.15);color:#34d399}.badge-mid{background:rgba(251,191,36,0.15);color:#fbbf24}.badge-slow{background:rgba(248,113,113,0.15);color:#f87171}
.top-row{display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0;font-size:0.9rem}
.top-rank{font-family:var(--xp-heading-font);font-weight:700;color:var(--xp-emerald);width:24px;text-align:center;flex-shrink:0}
.top-ping{font-family:var(--xp-heading-font);font-weight:600;min-width:50px;text-align:right;flex-shrink:0}
.top-host{color:var(--my-content-color);font-size:0.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-cq{background:linear-gradient(135deg,#10b981,#0d9488);border:none;color:#fff;font-weight:600;border-radius:0.75rem;padding:0.5rem 1rem;font-size:0.9rem;transition:all 0.3s;box-shadow:0 4px 18px rgba(16,185,129,0.3);text-decoration:none;display:inline-block}
.btn-cq:hover{color:#fff;transform:translateY(-2px);box-shadow:0 8px 30px rgba(16,185,129,0.45)}
.section-title{font-size:1.1rem;font-weight:700;margin-bottom:0.75rem;display:flex;align-items:center;gap:0.5rem}
.section-title .icon{color:var(--xp-emerald)}
.aurora{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:0;overflow:hidden}
.aurora-blob{position:absolute;border-radius:50%;filter:blur(100px);will-change:transform}
.aurora-b1{width:700px;height:700px;background:radial-gradient(circle,rgba(16,185,129,0.12) 0%,transparent 70%);top:-20%;right:-10%;animation:a1 20s ease-in-out infinite}
.aurora-b2{width:500px;height:500px;background:radial-gradient(circle,rgba(6,182,212,0.08) 0%,transparent 70%);bottom:-10%;left:-10%;animation:a2 25s ease-in-out infinite}
.aurora-b3{width:400px;height:400px;background:radial-gradient(circle,rgba(20,184,166,0.07) 0%,transparent 70%);top:40%;left:50%;animation:a3 18s ease-in-out infinite}
@keyframes a1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-60px) scale(1.15)}66%{transform:translate(-30px,30px) scale(.95)}}
@keyframes a2{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-50px,40px) scale(1.1)}66%{transform:translate(30px,-30px) scale(1.05)}}
@keyframes a3{0%,100%{transform:translate(0,0) scale(1.1)}33%{transform:translate(60px,30px) scale(.9)}66%{transform:translate(-40px,-50px) scale(1.2)}}
[data-bs-theme="light"] .aurora-blob{opacity:.5}
.vignette{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(3,7,6,0.85) 100%)}
[data-bs-theme="light"] .vignette{background:radial-gradient(ellipse at center,transparent 40%,rgba(200,220,210,0.4) 100%)}
.content-wrap{position:relative;z-index:1}
.theme-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:0.6rem;color:var(--my-heading-color);padding:0.35rem 0.6rem;cursor:pointer;font-size:1.1rem;transition:all 0.2s}
.theme-btn:hover{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.3)}
[data-bs-theme="light"] .theme-btn{background:rgba(6,78,59,0.04);border-color:rgba(6,78,59,0.1)}
.reveal{opacity:0;transform:translateY(24px);transition:opacity 0.7s,transform 0.7s cubic-bezier(0.4,0,0.2,1)}
.reveal.revealed{opacity:1;transform:none}
</style>
</head>
<body>
<div class="aurora"><div class="aurora-blob aurora-b1"></div><div class="aurora-blob aurora-b2"></div><div class="aurora-blob aurora-b3"></div></div>
<div class="vignette"></div>
<div class="content-wrap">
<nav class="py-3">
<div class="container my-container d-flex align-items-center justify-content-between">
<div class="d-flex align-items-center gap-2">
<div style="width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#10b981,#0d9488);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(16,185,129,0.35)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
</div>
<span style="font-family:var(--xp-heading-font);font-weight:800;font-size:1.35rem">Captcha<span class="gradient-text">Q</span></span>
</div>
<div class="d-flex align-items-center gap-2">
<button class="theme-btn" id="themeToggle" title="Toggle theme">🌙</button>
<a href="#" class="theme-btn" onclick="location.reload()" title="Refresh">🔄</a>
</div>
</div>
</nav>
<main class="container my-container pb-5">
<!-- Stats Cards -->
<div class="row g-3 mb-4 reveal" id="statsRow">
<div class="col-6 col-md-3"><div class="card-glass text-center"><div class="stat-value gradient-text" id="sAlive">—</div><div class="stat-label">alive</div></div></div>
<div class="col-6 col-md-3"><div class="card-glass text-center"><div class="stat-value" id="sDead" style="color:#f87171">—</div><div class="stat-label">dead</div></div></div>
<div class="col-6 col-md-3"><div class="card-glass text-center"><div class="stat-value" id="sMedian" style="color:#34d399">—</div><div class="stat-label">median ms</div></div></div>
<div class="col-6 col-md-3"><div class="card-glass text-center"><div class="stat-value" id="sCountries" style="color:#06b6d4">—</div><div class="stat-label">countries</div></div></div>
</div>
<!-- By Country -->
<div class="card-glass mb-4 reveal" id="ccCard">
<div class="section-title"><span class="icon">🌍</span> By Country</div>
<div id="ccList"></div>
</div>
<!-- Top 10 -->
<div class="card-glass mb-4 reveal" id="topCard">
<div class="section-title"><span class="icon">⚡</span> Top 10 Fastest</div>
<div id="topList"></div>
</div>
<!-- Subscriptions -->
<div class="card-glass mb-4 reveal" id="subCard">
<div class="section-title"><span class="icon">📋</span> Subscriptions</div>
<div class="d-flex flex-wrap gap-2 mb-3">
<a class="btn-cq" id="subLite">Lite</a>
<a class="btn-cq" id="subBest">Best</a>
<a class="btn-cq" id="subAll">All</a>
</div>
<div style="color:var(--my-content-color);font-size:0.85rem" id="subInfo"></div>
</div>
<!-- Footer -->
<div class="text-center py-3" style="color:var(--my-content-color);font-size:0.8rem">
<div id="footerTime"></div>
<div id="footerPerf" class="mt-1"></div>
</div>
</main>
</div>
<script>
const REPO='https://github.com/CaptchaQ/vless-servers.git';
const BRANCH='main';
function rawUrl(f){return REPO.replace('.git','')+'/raw/'+BRANCH+'/'+f}
function pingBadge(p){if(p<50)return'<span class="badge-fast">⚡'+p+'ms</span>';if(p<150)return'<span class="badge-mid">🟡'+p+'ms</span>';return'<span class="badge-slow">🔴'+p+'ms</span>'}
function pingClass(p){return p<50?'ping-fast':p<150?'ping-mid':'ping-slow'}
function barColor(p){return p<50?'#34d399':p<150?'#fbbf24':'#f87171'}
function initTheme(){try{const t=localStorage.getItem('cq-theme')||'dark';document.documentElement.setAttribute('data-bs-theme',t);document.getElementById('themeToggle').textContent=t==='dark'?'☀️':'🌙'}catch(e){}}
function toggleTheme(){try{const cur=document.documentElement.getAttribute('data-bs-theme')||'dark';const next=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-bs-theme',next);localStorage.setItem('cq-theme',next);document.getElementById('themeToggle').textContent=next==='dark'?'☀️':'🌙'}catch(e){}}
function reveal(){const els=document.querySelectorAll('.reveal');const obs=new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('revealed');obs.unobserve(e.target)}})},{threshold:0.1});els.forEach(el=>obs.observe(el))}
function buildCC(list){const maxCount=Math.max(...list.map(i=>i.count),1);let html='';list.forEach(i=>{const pct=Math.round(i.count/maxCount*100);const medPct=Math.min(i.median_ms/300*100,100);html+=`<div class="cc-row"><span class="cc-flag">${i.flag}</span><span class="cc-name">${i.name} (${i.cc})</span><div class="cc-bar-wrap"><div class="cc-bar" style="width:${pct}%;background:${barColor(i.median_ms)}"></div></div><span class="cc-ping ${pingClass(i.median_ms)}">${i.median_ms}ms</span><span class="cc-count">${i.count} srv</span></div>`});return html}
function buildTop(servers){let html='';servers.slice(0,10).forEach((s,idx)=>{html+=`<div class="top-row"><span class="top-rank">${idx+1}</span>${pingBadge(s.ping_ms)}<span class="top-host">${s.name.slice(0,35)}</span><span class="top-ping ${pingClass(s.ping_ms)}">${s.host}:${s.port}</span></div>`});return html}
async function load(){try{const[s,d]=await Promise.all([fetch(rawUrl('stats.json')).then(r=>r.json()),fetch(rawUrl('detailed.json')).then(r=>r.json())]);document.getElementById('sAlive').textContent=s.total_working;document.getElementById('sDead').textContent=s.total_dead||0;document.getElementById('sMedian').textContent=s.ping_median_ms||'—';document.getElementById('sCountries').textContent=Object.keys(s.countries).length;const ccList=Object.entries(d).map(([cc,v])=>({cc,name:v.name,flag:v.flag||cc,count:v.count,median_ms:v.median_ms,min_ms:v.min_ms,max_ms:v.max_ms})).sort((a,b)=>b.count-a.count);document.getElementById('ccList').innerHTML=buildCC(ccList);const allSrv=[];Object.values(d).forEach(v=>{v.servers.forEach(s=>allSrv.push({...s,cc:v.name}))});allSrv.sort((a,b)=>a.ping_ms-b.ping_ms);document.getElementById('topList').innerHTML=buildTop(allSrv);document.getElementById('subLite').href=rawUrl('working_lite.txt');document.getElementById('subBest').href=rawUrl('working_best.txt');document.getElementById('subAll').href=rawUrl('working_all.txt');document.getElementById('subInfo').textContent=`Lite: ${s.total_lite||'?'} srv | Best: ${s.total_best||'?'} srv | All: ${s.total_working} srv`;document.getElementById('footerTime').textContent='Updated: '+(s.updated_utc||'').replace('T',' ').slice(0,19)+' UTC';document.getElementById('footerPerf').textContent=`Check: ${s.elapsed_seconds||'?'}s | RAM: ${s.memory_peak_mb||'?'} MB`;reveal()}catch(e){document.getElementById('ccList').innerHTML='<div style="color:#f87171">Failed to load data: '+e.message+'</div>'}
}
initTheme();document.getElementById('themeToggle').addEventListener('click',toggleTheme);load();
</script>
</body>
</html>
